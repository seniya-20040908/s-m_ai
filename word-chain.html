<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Chain Game - Seni & Mahe AI Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-cyan: #0284c7;
            --accent-purple: #7c3aed;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(2, 132, 199, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0 0 16px 16px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .game-container {
            margin: 2rem auto;
            text-align: center;
            max-width: 700px;
            width: 90%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        .score-board {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent-cyan);
        }

        .chat-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 250px;
            overflow-y: auto;
            padding: 15px;
            text-align: left;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 1rem;
        }

        .ai-msg {
            background: rgba(0, 240, 255, 0.1);
            border-left: 4px solid var(--accent-cyan);
            color: var(--text-main);
            align-self: flex-start;
        }

        .user-msg {
            background: rgba(112, 0, 255, 0.2);
            border-right: 4px solid var(--accent-purple);
            color: var(--text-main);
            align-self: flex-end;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .word-input {
            flex: 1;
            padding: 12px 15px;
            background: #1e293b;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
        }

        .word-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .submit-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 0 25px;
            font-weight: 700;
            font-size: 1.1igrem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">AI Word <span>Chain</span></div>
        <a href="games.html" class="back-btn">← Back to Games Hub</a>
    </header>

    <div class="game-container">
        <div class="score-board">SCORE: <span id="scoreVal">0</span> | CURRENT REQUIRED LETTER: <span id="reqLetter" style="color: #ff0055;">A</span></div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">🤖 AI Bot: Welcome! Let's play Word Chain. I started with the word **"Apple"**. Your turn! Type a word starting with **"e"**.</div>
        </div>

        <div class="input-group">
            <input type="text" id="userWordInput" class="word-input" placeholder="Type your word here..." autocomplete="off">
            <button class="submit-btn" onclick="submitWord()">SEND 🚀</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Seni & Mahe AI Creations. All rights reserved.
    </footer>

    <script>
        let score = 0;
        let currentLetter = 'e'; // Apple ends with e
        let usedWords = ['apple'];

        // AI Word Database for chaining
        const aiDictionary = {
            'a': ['ant', 'animal', 'airplane', 'action', 'active'],
            'b': ['ball', 'banana', 'bridge', 'blue', 'butterfly'],
            'c': ['cat', 'car', 'cloud', 'computer', 'city'],
            'd': ['dog', 'door', 'dance', 'drum', 'danger'],
            'e': ['elephant', 'energy', 'eagle', 'earth', 'engine'],
            'f': ['fish', 'fire', 'flower', 'forest', 'future'],
            'g': ['game', 'girl', 'garden', 'green', 'guitar'],
            'h': ['house', 'horse', 'heart', 'happy', 'hero'],
            'i': ['ice', 'island', 'idea', 'insect', 'iron'],
            'j': ['juice', 'jump', 'jacket', 'jungle', 'jewel'],
            'k': ['kite', 'king', 'kangaroo', 'key', 'kitchen'],
            'l': ['lion', 'lamp', 'leaf', 'lemon', 'light'],
            'm': ['moon', 'monkey', 'music', 'mountain', 'magic'],
            'n': ['nest', 'night', 'note', 'name', 'nature'],
            'o': ['orange', 'ocean', 'owl', 'onion', 'orbit'],
            'p': ['pencil', 'pen', 'plant', 'plane', 'phone'],
            'q': ['queen', 'quick', 'quiet', 'quilt', 'quiz'],
            'r': ['rabbit', 'rose', 'river', 'ring', 'rocket'],
            's': ['sun', 'star', 'snake', 'ship', 'school'],
            't': ['tree', 'tiger', 'train', 'Table', 'time'],
            'u': ['umbrella', 'unicorn', 'uncle', 'unit', 'universe'],
            'v': ['vase', 'violin', 'village', 'volcano', 'voice'],
            'h': ['water', 'wind', 'window', 'wolf', 'world'],
            'x': ['xylophone', 'xray'],
            'y': ['yellow', 'yogurt', 'yard', 'yacht'],
            'z': ['zebra', 'zoo', 'zero', 'zone']
        };

        const chatBox = document.getElementById('chatBox');
        const scoreVal = document.getElementById('scoreVal');
        const reqLetter = document.getElementById('reqLetter');
        const userWordInput = document.getElementById('userWordInput');

        userWordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitWord();
        });

        function submitWord() {
            let word = userWordInput.value.trim().toLowerCase();
            if (!word) return;

            // Rule 1: Check starting letter
            if (word[0] !== currentLetter) {
                appendMessage(`❌ Your word must start with the letter "${currentLetter.toUpperCase()}!"`, 'ai-msg');
                userWordInput.value = '';
                return;
            }

            // Rule 2: Check if already used
            if (usedWords.includes(word)) {
                appendMessage(`⚠️ This word has already been used! Try another.`, 'ai-msg');
                userWordInput.value = '';
                return;
            }

            // User valid word
            usedWords.push(word);
            appendMessage(`You: ${word}`, 'user-msg');
            score += 10;
            scoreVal.innerText = score;
            userWordInput.value = '';

            // AI generates response
            let lastChar = word[word.length - 1];
            let possibleWords = aiDictionary[lastChar] || ['apple', 'ball', 'cat'];
            
            // Filter unused words
            let freshWords = possibleWords.filter(w => !usedWords.includes(w));
            let aiWord = '';
            
            if (freshWords.length > 0) {
                aiWord = freshWords[Math.floor(Math.random() * freshWords.length)];
            } else {
                aiWord = lastChar + "at"; // Fallback
            }

            usedWords.push(aiWord);
            currentLetter = aiWord[aiWord.length - 1];
            reqLetter.innerText = currentLetter.toUpperCase();

            setTimeout(() => {
                appendMessage(`🤖 AI Bot: ${aiWord} (Your turn! Starts with "${currentLetter.toUpperCase()}")`, 'ai-msg');
            }, 600);
        }

        function appendMessage(text, className) {
            let div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
