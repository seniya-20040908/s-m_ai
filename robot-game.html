<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Runner & Gun - Seni & Mahe AI Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 0 0 16px 16px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .game-wrapper {
            margin: 1.5rem auto;
            text-align: center;
            max-width: 800px;
            width: 95%;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        canvas {
            background: linear-gradient(to bottom, #020617, #0f172a);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .controls-hint {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-action:active, .btn-action:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">CYBER <span>RUNNER & GUN</span></div>
        <a href="games.html" class="back-btn">← Games Hub</a>
    </header>

    <div class="game-wrapper">
        <div class="hud">
            <div>SCORE: <span id="scoreVal">0</span></div>
            <div>HP: <span id="hpVal" style="color: #00ff88;">100</span>%</div>
            <div>ENERGY: <span id="energyVal" style="color: #ff0055;">100</span></div>
        </div>

        <canvas id="gameCanvas" width="720" height="350"></canvas>

        <div class="controls-hint">
            <button class="btn-action" onclick="playerJump()">⬆️ JUMP (Space)</button>
            <button class="btn-action" onclick="playerShoot()">🔥 SHOOT (F)</button>
            <button class="btn-action" onclick="playerSuperDash()">⚡ SUPER DASH (G)</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Seni & Mahe AI Creations. All rights reserved.
    </footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let hp = 100;
        let energy = 100;
        let isGameOver = false;

        // Player properties
        let player = {
            x: 50,
            y: 250,
            width: 40,
            height: 50,
            vy: 0,
            gravity: 0.8,
            jumpPower: -13,
            isJumping: false,
            color: "#00f0ff"
        };

        let obstacles = [];
        let bullets = [];
        let particles = [];
        let gameSpeed = 5;
        let frameCount = 0;

        // Keyboard Controls
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                playerJump();
                e.preventDefault();
            }
            if (e.code === "KeyF") {
                playerShoot();
            }
            if (e.code === "KeyG") {
                playerSuperDash();
            }
        });

        function playerJump() {
            if (!player.isJumping && !isGameOver) {
                player.vy = player.jumpPower;
                player.isJumping = true;
                createParticles(player.x, player.y + player.height, "#00f0ff", 10);
            }
        }

        function playerShoot() {
            if (isGameOver) return;
            bullets.push({
                x: player.x + player.width,
                y: player.y + player.height / 2 - 4,
                width: 15,
                height: 6,
                speed: 10,
                color: "#ff0055"
            });
            createParticles(player.x + player.width, player.y + player.height / 2, "#ff0055", 5);
        }

        function playerSuperDash() {
            if (energy >= 30 && !isGameOver) {
                energy -= 30;
                gameSpeed += 4;
                setTimeout(() => { gameSpeed -= 4; }, 1500);
                createParticles(player.x, player.y, "#7000ff", 25);
            }
            document.getElementById("energyVal").innerText = energy;
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    life: 20
                });
            }
        }

        function spawnObstacle() {
            let type = Math.random() > 0.4 ? "drone" : "barrier";
            let obs = {
                x: canvas.width,
                y: type === "drone" ? 170 + Math.random() * 60 : 260,
                width: 35,
                height: type === "drone" ? 30 : 40,
                type: type,
                color: type === "drone" ? "#ff0055" : "#7000ff"
            };
            obstacles.push(obs);
        }

        function update() {
            if (isGameOver) return;

            frameCount++;
            if (frameCount % 90 === 0) {
                spawnObstacle();
                if (energy < 100) energy = Math.min(100, energy + 5);
                document.getElementById("energyVal").innerText = energy;
            }

            // Player physics
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y > 250) {
                player.y = 250;
                player.vy = 0;
                player.isJumping = false;
            }

            // Move Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // Check bullet collision with obstacles
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < obstacles[i].x + obstacles[i].width &&
                        bullets[j].x + bullets[j].width > obstacles[i].x &&
                        bullets[j].y < obstacles[i].y + obstacles[i].height &&
                        bullets[j].y + bullets[j].height > obstacles[i].y
                    ) {
                        createParticles(obstacles[i].x, obstacles[i].y, "#ff0055", 15);
                        obstacles.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 25;
                        document.getElementById("scoreVal").innerText = score;
                        break;
                    }
                }

                // Check player collision with obstacles
                if (
                    obstacles[i] &&
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    hp -= 20;
                    document.getElementById("hpVal").innerText = hp;
                    createParticles(player.x, player.y, "#ff0000", 20);
                    obstacles.splice(i, 1);

                    if (hp <= 0) {
                        hp = 0;
                        isGameOver = true;
                    }
                }

                // Remove off-screen obstacles
                else if (obstacles[i] && obstacles[i].x < -50) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("scoreVal").innerText = score;
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background grid / stars
            ctx.strokeStyle = "rgba(0, 240, 255, 0.08)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Draw Ground line
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(canvas.width, 300);
            ctx.stroke();

            // Draw Player (Cyber Robot)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Robot Visor glow
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(player.x + 20, player.y + 10, 15, 8);

            // Draw Bullets
            for (let b of bullets) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }

            // Draw Obstacles
            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Game Over Text
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 35px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("MISSION FAILED 💥", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#00f0ff";
                ctx.font = "20px 'Outfit', sans-serif";
                ctx.fillText("Click anywhere or press Enter to Restart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener("click", function() {
            if (isGameOver) {
                location.reload();
            }
        });

        loop();
    </script>
</body>
</html>
