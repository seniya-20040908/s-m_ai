<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Rock-Paper-Scissors - Seni & Mahe AI Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-cyan: #0284c7;
            --accent-purple: #7c3aed;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(2, 132, 199, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0 0 16px 16px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .game-container {
            margin: 2rem auto;
            text-align: center;
            max-width: 700px;
            width: 90%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent-cyan);
        }

        .battle-arena {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 2rem 0;
            font-size: 4rem;
        }

        .fighter-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 15px;
            min-width: 150px;
        }

        .fighter-label {
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .result-text {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            margin: 1.5rem 0;
            color: #ff0055;
            min-height: 40px;
        }

        .choices-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
        }

        .choice-btn {
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--text-main);
            font-size: 2.5rem;
            padding: 15px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .choice-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">Smart AI <span>RPS Arena</span></div>
        <a href="games.html" class="back-btn">← Back to Games Hub</a>
    </header>

    <div class="game-container">
        <div class="score-board">
            <div>YOU: <span id="playerScore">0</span></div>
            <div>AI BOT: <span id="aiScore">0</span></div>
        </div>

        <div class="battle-arena">
            <div class="fighter-box">
                <div class="fighter-label">You</div>
                <div id="playerChoiceDisplay">❓</div>
            </div>
            <div style="font-size: 2rem; font-family: 'Rajdhani'; color: var(--text-muted);">VS</div>
            <div class="fighter-box">
                <div class="fighter-label">AI Bot</div>
                <div id="aiChoiceDisplay">❓</div>
            </div>
        </div>

        <div class="result-text" id="resultDisplay">Make your move!</div>

        <div class="choices-container">
            <button class="choice-btn" onclick="playGame('Rock')">🧱</button>
            <button class="choice-btn" onclick="playGame('Paper')">📄</button>
            <button class="choice-btn" onclick="playGame('Scissors')">✂️</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Seni & Mahe AI Creations. All rights reserved.
    </footer>

    <script>
        let pScore = 0;
        let aScore = 0;
        let playerHistory = [];

        const emojis = {
            'Rock': '🧱',
            'Paper': '📄',
            'Scissors': '✂️'
        };

        function playGame(playerChoice) {
            // AI Smart Logic: Predicts based on player's previous choice pattern
            let aiChoice = '';
            if (playerHistory.length > 0 && Math.random() < 0.6) {
                // Smart AI predicts what player usually plays and counters it!
                let lastMove = playerHistory[playerHistory.length - 1];
                if (lastMove === 'Rock') aiChoice = 'Paper';
                else if (lastMove === 'Paper') aiChoice = 'Scissors';
                else aiChoice = 'Rock';
            } else {
                // Random fallback
                const choices = ['Rock', 'Paper', 'Scissors'];
                aiChoice = choices[Math.floor(Math.random() * choices.length)];
            }

            playerHistory.push(playerChoice);

            // Display Choices
            document.getElementById('playerChoiceDisplay').innerText = emojis[playerChoice];
            document.getElementById('aiChoiceDisplay').innerText = emojis[aiChoice];

            const resultEl = document.getElementById('resultDisplay');

            // Determine Winner
            if (playerChoice === aiChoice) {
                resultEl.innerText = "IT'S A TIE!";
                resultEl.style.color = "#00f0ff";
            } else if (
                (playerChoice === 'Rock' && aiChoice === 'Scissors') ||
                (playerChoice === 'Paper' && aiChoice === 'Rock') ||
                (playerChoice === 'Scissors' && aiChoice === 'Paper')
            ) {
                resultEl.innerText = "YOU WIN! 🎉";
                resultEl.style.color = "#00ff88";
                pScore++;
                document.getElementById('playerScore').innerText = pScore;
            } else {
                resultEl.innerText = "AI BOT WINS! 🤖";
                resultEl.style.color = "#ff0055";
                aScore++;
                document.getElementById('aiScore').innerText = aScore;
            }
        }
    </script>
</body>
</html>
