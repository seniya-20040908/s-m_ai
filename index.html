<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Testimonials</title>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "seni-and-mahe-ai",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Form Submit කිරීම
        const reviewForm = document.getElementById('reviewForm');
        if (reviewForm) {
            reviewForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const ratingVal = document.getElementById('rating').value;
                const text = document.getElementById('text').value;
                const formMessage = document.getElementById('formMessage');

                let ratingNumber = 5;
                const parsed = parseInt(ratingVal);
                ratingNumber = isNaN(parsed) ? 5 : parsed;

                try {
                    await addDoc(collection(db, "reviews"), {
                        name: name,
                        rating: ratingNumber,
                        text: text,
                        status: "pending",
                        createdAt: new Date()
                    });

                    if (formMessage) {
                        formMessage.style.display = 'block';
                        formMessage.style.color = '#22c55e'; // කොළ පාට
                        formMessage.innerHTML = "✅ Your review has been successfully submitted! It will appear publicly after approval. Thank you!";
                    }
                    reviewForm.reset();
                } catch (error) {
                    console.error("Error adding document: ", error);
                    if (formMessage) {
                        formMessage.style.display = 'block';
                        formMessage.style.color = '#ef4444';
                        formMessage.innerHTML = "❌ Error submitting review. Please try again.";
                    }
                }
            });
        }

        // Approved Reviews ලෝඩ් කර ගැනීම
        async function loadApprovedReviews() {
            const reviewsContainer = document.getElementById('reviewsContainer');
            const totalReviewsEl = document.getElementById('totalReviews');
            const avgRatingEl = document.getElementById('avgRating');

            try {
                const q = query(collection(db, "reviews"), where("status", "==", "approved"));
                const querySnapshot = await getDocs(q);
                
                if (reviewsContainer) reviewsContainer.innerHTML = '';
                let total = 0;
                let ratingSum = 0;

                querySnapshot.forEach((doc) => {
                    const review = doc.data();
                    total++;
                    
                    let rNum = typeof review.rating === 'number' ? review.rating : (parseInt(review.rating) || 5);
                    ratingSum += rNum;

                    const starsHtml = '⭐'.repeat(rNum);

                    if (reviewsContainer) {
                        const card = document.createElement('div');
                        card.style.cssText = "background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px;";
                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; font-weight: bold; color: #38bdf8;">
                                <span>${review.name}</span>
                                <span>${starsHtml}</span>
                            </div>
                            <p style="margin-top: 8px; color: #e2e8f0;">${review.text}</p>
                        `;
                        reviewsContainer.appendChild(card);
                    }
                });

                if (totalReviewsEl) totalReviewsEl.textContent = total;
                if (avgRatingEl) {
                    if (total > 0) {
                        const avg = (ratingSum / total).toFixed(1);
                        avgRatingEl.textContent = `${avg} / 5`;
                    } else {
                        avgRatingEl.textContent = `0.0 / 5`;
                    }
                }

            } catch (error) {
                console.error("Error loading reviews: ", error);
                if (reviewsContainer) {
                    reviewsContainer.innerHTML = `<p style="text-align: center; color: #ef4444;">අදහස් පූරණය කරගැනීමේ දෝෂයක් ඇත.</p>`;
                }
            }
        }

        loadApprovedReviews();
    </script>
</head>
<body>
    <!-- ඔබගේ මුල් ඩිසයිනර් ස්ටයිල්ස් සහ කන්ටේනර් මෙහි ඇත -->
</body>
</html>
