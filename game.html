<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Car Racer - Seni & Mahe AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .game-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #111;
            border: 3px solid var(--accent-cyan);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #1a1a2e;
        }

        .ui-layer {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 5px #000;
            pointer-events: none;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .screen-overlay h2 {
            font-size: 2.2rem;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            font-family: 'Rajdhani', sans-serif;
        }

        .screen-overlay p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .btn {
            padding: 10px 25px;
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        .back-link {
            margin-top: 20px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .back-link:hover {
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <h1>Cyber Car Racer</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Seni & Mahe AI Arcade</p>
    </div>

    <div class="game-container">
        <!-- UI Scores -->
        <div class="ui-layer">
            <div>Score: <span id="scoreVal">0</span></div>
            <div>Speed: <span id="speedVal">60</span> km/h</div>
        </div>

        <!-- Canvas for Game Graphics -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Start / Pause Screen -->
        <div id="startScreen" class="screen-overlay">
            <h2>Ready to Race?</h2>
            <p>Use <b>Arrow Left / Right</b> (or A/D keys) to steer. Avoid crashing into traffic cars!</p>
            <button class="btn" onclick="startGame()">Start Engine 🚀</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h2 style="color: #ff3366;">Crash! Game Over</h2>
            <p>Your Final Score: <span id="finalScore" style="color: #fff; font-weight: bold;">0</span></p>
            <button class="btn" onclick="startGame()">Play Again 🔄</button>
        </div>
    </div>

    <div class="controls-hint">
        💡 Mobile Users: Touch and drag left/right on the game screen to steer.
    </div>

    <a href="index.html" class="back-link">← Back to Main Website</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // UI Elements
        const scoreValElem = document.getElementById("scoreVal");
        const speedValElem = document.getElementById("speedVal");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const finalScoreElem = document.getElementById("finalScore");

        // Web Audio API for Sound Effects (Sound FX without external audio files)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // Game Variables
        let gameRunning = false;
        let score = 0;
        let roadSpeed = 5;
        let roadLineOffset = 0;

        // Player Car
        let player = {
            x: 175,
            y: 480,
            width: 50,
            height: 90,
            speed: 6,
            color: "#00f0ff"
        };

        // Controls
        let keys = { ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = false;
        });

        // Mobile Touch Support
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX - player.width / 2;
            if (player.x < 55) player.x = 55;
            if (player.x > canvas.width - 55 - player.width) player.x = canvas.width - 55 - player.width;
            e.preventDefault();
        }, { passive: false });

        // Obstacles (Traffic Cars)
        let obstacles = [];
        let obstacleTimer = 0;

        function startGame() {
            playSound('start');
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            player.x = 175;
            obstacles = [];
            score = 0;
            roadSpeed = 5;
            obstacleTimer = 0;
            gameRunning = true;
            loop();
        }

        function gameOver() {
            gameRunning = false;
            playSound('crash');
            finalScoreElem.innerText = Math.floor(score);
            gameOverScreen.style.display = "flex";
        }

        function spawnObstacle() {
            const lanes = [70, 175, 280]; // 3 Lanes
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            const colors = ["#ff3366", "#7000ff", "#ffcc00", "#00ff80"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            obstacles.push({
                x: randomLane,
                y: -100,
                width: 50,
                height: 90,
                speed: roadSpeed + (Math.random() * 2 - 1),
                color: randomColor
            });
        }

        function drawCar(x, y, width, height, color, isPlayer = false) {
            ctx.save();
            // Car Body Shadow / Glow
            ctx.shadowColor = color;
            ctx.shadowBlur = isPlayer ? 15 : 5;

            // Main Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 12);
            ctx.fill();

            // Windshield & Details
            ctx.fillStyle = "#070a0f";
            ctx.fillRect(x + 8, y + 20, width - 16, 20); // Front window
            ctx.fillRect(x + 10, y + 55, width - 20, 15); // Back window

            // Headlights / Taillights
            ctx.fillStyle = isPlayer ? "#00f0ff" : "#ff3366";
            ctx.fillRect(x + 5, y + (isPlayer ? 2 : height - 5), 8, 4);
            ctx.fillRect(x + width - 13, y + (isPlayer ? 2 : height - 5), 8, 4);

            ctx.restore();
        }

        function update() {
            if (!gameRunning) return;

            // Move Player
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            // Road Bounds (Keep car inside asphalt)
            if (player.x < 50) player.x = 50;
            if (player.x > canvas.width - 50 - player.width) player.x = canvas.width - 50 - player.width;

            // Scroll Road lines
            roadLineOffset += roadSpeed;
            if (roadLineOffset > 40) roadLineOffset = 0;

            // Increase difficulty over time
            score += 0.1;
            roadSpeed = 5 + Math.floor(score / 20) * 0.5;

            // Spawn obstacles
            obstacleTimer++;
            if (obstacleTimer > Math.max(40, 90 - roadSpeed * 3)) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            // Move obstacles & Collision Detection
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += roadSpeed;

                // Collision check (AABB Box Collision)
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameOver();
                }

                // Remove off-screen obstacles
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update UI text
            scoreValElem.innerText = Math.floor(score);
            speedValElem.innerText = Math.floor(roadSpeed * 12);
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Road (Asphalt)
            ctx.fillStyle = "#1a1a2e";
            ctx.fillRect(40, 0, canvas.width - 80, canvas.height);

            // Road borders (Side grass/lights)
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, 40, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);

            // Animated Center Lines
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.lineDashOffset = -roadLineOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw Obstacles
            for (let obs of obstacles) {
                drawCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
            }

            // Draw Player Car
            drawCar(player.x, player.y, player.width, player.height, player.color, true);
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
