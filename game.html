<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Car Race - Seni & Mahe AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .game-container {
            margin: 2rem 0;
            text-align: center;
            position: relative;
        }

        canvas {
            background: #111;
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            max-width: 100%;
            height: auto;
        }

        .game-ui {
            display: flex;
            justify-content: space-between;
            width: 400px;
            max-width: 100%;
            margin: 10px auto;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-cyan);
        }

        .controls-hint {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 0.9rem;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            gap: 20px;
            margin-top: 15px;
        }

        .control-btn {
            background: var(--card-bg);
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 1.5rem;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .control-btn:active {
            background: var(--accent-cyan);
            color: #000;
        }

        @media (max-width: 600px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>Seni & Mahe <span>AI Games</span></h2>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </header>

    <div class="game-container">
        <div class="game-ui">
            <span id="scoreDisplay">SCORE: 0</span>
            <span id="levelDisplay">LEVEL: 1</span>
            <span id="livesDisplay">LIVES: ❤️❤️❤️</span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="controls-hint">Use Left/Right Arrow Keys or A/D to steer your Cyber Car! Avoid incoming Traffic.</div>

        <div class="mobile-controls">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');

        let score = 0;
        let level = 1;
        let lives = 3;
        let gameOver = false;
        let gameSpeed = 4;
        let roadLineOffset = 0;

        // Player Car
        const player = {
            x: 175,
            y: 480,
            width: 50,
            height: 90,
            speed: 6,
            color: '#00f0ff'
        };

        let trafficCars = [];
        let particles = [];
        let keys = {};

        // Keyboard Event Listeners
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        // Mobile Controls Listeners
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', () => { keys['ArrowLeft'] = true; });
        leftBtn.addEventListener('touchend', () => { keys['ArrowLeft'] = false; });
        rightBtn.addEventListener('touchstart', () => { keys['ArrowRight'] = true; });
        rightBtn.addEventListener('touchend', () => { keys['ArrowRight'] = false; });

        // Spawn Traffic Cars
        function spawnTraffic() {
            if (Math.random() < 0.02 + (level * 0.005)) {
                const lanes = [40, 130, 220, 310];
                const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                trafficCars.push({
                    x: laneX,
                    y: -100,
                    width: 50,
                    height: 90,
                    speed: gameSpeed + Math.random() * 2,
                    color: '#ff0055'
                });
            }
        }

        // Draw Cyber Car
        function drawCar(x, y, width, height, color, isPlayer = false) {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fillStyle = color;

            // Car Body
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 10);
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#070a0f';
            ctx.fillRect(x + 8, y + 20, width - 16, 20);

            // Headlights
            ctx.fillStyle = isPlayer ? '#ffffff' : '#ffff00';
            ctx.fillRect(x + 5, y + 2, 8, 4);
            ctx.fillRect(x + width - 13, y + 2, 8, 4);

            // Taillights
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 5, y + height - 6, 8, 4);
            ctx.fillRect(x + width - 13, y + height - 6, 8, 4);

            ctx.restore();
        }

        // Draw Road & Moving Lines
        function drawRoad() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road borders
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(15, 0); ctx.lineTo(15, canvas.height);
            ctx.moveTo(canvas.width - 15, 0); ctx.lineTo(canvas.width - 15, canvas.height);
            ctx.stroke();

            // Center Dashed Lanes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadLineOffset;

            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        // Collision Detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Game Loop Update
        function update() {
            if (gameOver) return;

            // Move Road
            roadLineOffset += gameSpeed;

            // Player Movement
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 25) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width - 25) {
                player.x += player.speed;
            }

            // Spawn and move traffic
            spawnTraffic();
            for (let i = trafficCars.length - 1; i >= 0; i--) {
                trafficCars[i].y += trafficCars[i].speed;

                // Check Collision with Player
                if (checkCollision(player, trafficCars[i])) {
                    lives--;
                    trafficCars.splice(i, 1);
                    updateLivesUI();

                    if (lives <= 0) {
                        gameOver = true;
                    }
                    continue;
                }

                // Remove off-screen cars & add score
                if (trafficCars[i].y > canvas.height) {
                    trafficCars.splice(i, 1);
                    score += 10;
                    scoreDisplay.innerText = "SCORE: " + score;

                    // Level Progression
                    if (score % 100 === 0) {
                        level++;
                        gameSpeed += 1;
                        levelDisplay.innerText = "LEVEL: " + level;
                    }
                }
            }
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesDisplay.innerText = "LIVES: " + hearts;
        }

        // Render Everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            // Draw Traffic Cars
            trafficCars.forEach(car => {
                drawCar(car.x, car.y, car.width, car.height, car.color, false);
            });

            // Draw Player Car
            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(7, 10, 15, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 36px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '20px Outfit';
                ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);

                ctx.fillStyle = '#00f0ff';
                ctx.font = '16px Outfit';
                ctx.fillText('Click / Tap Here to Restart', canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        // Main Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Restart on Click after Game Over
        canvas.addEventListener('click', () => {
            if (gameOver) {
                score = 0;
                level = 1;
                lives = 3;
                gameSpeed = 4;
                trafficCars = [];
                gameOver = false;
                scoreDisplay.innerText = "SCORE: 0";
                levelDisplay.innerText = "LEVEL: 1";
                updateLivesUI();
            }
        });

        loop();
    </script>
</body>
</html>
