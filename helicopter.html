<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chopper - Action Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff0055;
            --text-main: #f8fafc;
            --border-color: rgba(0, 240, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 10;
        }

        h1 {
            font-size: 1.3rem;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .game-container {
            position: relative;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 18px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
        }

        canvas {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            border-radius: 12px;
            display: block;
            cursor: pointer;
        }

        .controls-hint {
            margin-top: 10px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .controls-hint span {
            color: var(--accent-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="games.html" class="back-btn">&#8592; Back</a>
        <h1>Neon Chopper: Sky Battle</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="controls-hint">
            <span>UP / DOWN ARROWS</span> or <span>MOUSE</span> to Move | Collect Stars, Avoid Missiles!
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highScore = localStorage.getItem("chopperActionHighScore") || 0;
        let gameOver = false;
        let gameStarted = false;

        // Helicopter Object
        let heli = {
            x: 100,
            y: 225,
            w: 60,
            h: 30,
            speed: 5,
            rotorAngle: 0
        };

        let missiles = [];
        let stars = [];
        let particles = [];
        let frameCount = 0;

        let keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if(!gameStarted && (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown")) {
                gameStarted = true;
            }
            if(gameOver && e.code === "Space") {
                resetGame();
            }
            if(e.code === "Space") e.preventDefault();
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // Mouse movement support
        canvas.addEventListener("mousemove", (e) => {
            if(!gameStarted) gameStarted = true;
            let rect = canvas.getBoundingClientRect();
            let mouseY = e.clientY - rect.top;
            if(gameStarted && !gameOver) {
                heli.y = mouseY - heli.h / 2;
            }
        });

        canvas.addEventListener("click", () => {
            if(!gameStarted) gameStarted = true;
            else if(gameOver) resetGame();
        });

        function resetGame() {
            heli.y = 225;
            missiles = [];
            stars = [];
            particles = [];
            score = 0;
            frameCount = 0;
            gameOver = false;
        }

        function spawnMissile() {
            let mY = Math.floor(Math.random() * (canvas.height - 80)) + 40;
            missiles.push({
                x: canvas.width,
                y: mY,
                w: 40,
                h: 14,
                speed: 5 + Math.random() * 3
            });
        }

        function spawnStar() {
            let sY = Math.floor(Math.random() * (canvas.height - 80)) + 40;
            stars.push({
                x: canvas.width,
                y: sY,
                radius: 12
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            if (!gameStarted || gameOver) return;

            frameCount++;
            heli.rotorAngle += 0.5;

            // Keyboard movement
            if ((keys["ArrowUp"] || keys["KeyW"]) && heli.y > 10) {
                heli.y -= heli.speed;
            }
            if ((keys["ArrowDown"] || keys["KeyS"]) && heli.y < canvas.height - heli.h - 10) {
                heli.y += heli.speed;
            }

            // Boundary limit
            if (heli.y < 10) heli.y = 10;
            if (heli.y > canvas.height - heli.h - 10) heli.y = canvas.height - heli.h - 10;

            // Spawn missiles and stars
            if (frameCount % 80 === 0) spawnMissile();
            if (frameCount % 60 === 0) spawnStar();

            // Update Missiles
            for (let i = missiles.length - 1; i >= 0; i--) {
                missiles[i].x -= missiles[i].speed;

                // Collision with Helicopter
                if (
                    heli.x < missiles[i].x + missiles[i].w &&
                    heli.x + heli.w > missiles[i].x &&
                    heli.y < missiles[i].y + missiles[i].h &&
                    heli.y + heli.h > missiles[i].y
                ) {
                    gameOver = true;
                    createParticles(heli.x + heli.w/2, heli.y + heli.h/2, "#ff0055");
                }

                if (missiles[i].x + missiles[i].w < 0) {
                    missiles.splice(i, 1);
                    score += 5; // survived missile
                }
            }

            // Update Stars (Points)
            for (let i = stars.length - 1; i >= 0; i--) {
                stars[i].x -= 3.5;

                let distX = (heli.x + heli.w/2) - stars[i].x;
                let distY = (heli.y + heli.h/2) - stars[i].y;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < heli.w/3 + stars[i].radius) {
                    score += 20;
                    createParticles(stars[i].x, stars[i].y, "#00f0ff");
                    stars.splice(i, 1);
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("chopperActionHighScore", highScore);
                    }
                    continue;
                }

                if (stars[i].x + stars[i].radius < 0) {
                    stars.splice(i, 1);
                }
            }

            // Particles update
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = "rgba(0, 240, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw Stars
            stars.forEach(s => {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f0ff";
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Missiles
            missiles.forEach(m => {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff0055";
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(m.x, m.y, m.w, m.h);
                // Missile head flame
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(m.x + m.w, m.y + 3, 8, 8);
                ctx.restore();
            });

            // Draw Detailed Helicopter
            if (!gameOver || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.save();
                ctx.translate(heli.x, heli.y);

                // Body
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f0ff";
                ctx.fillStyle = "#00f0ff";
                ctx.fillRect(0, 0, heli.w, heli.h);

                // Cockpit
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(35, 4, 18, heli.h - 8);

                // Tail
                ctx.fillStyle = "#00f0ff";
                ctx.fillRect(-20, 10, 20, 6);

                // Rotor Blade
                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ffffff";
                ctx.beginPath();
                let bladeW = Math.cos(heli.rotorAngle) * 45;
                ctx.rect(heli.w / 2 - bladeW / 2, -6, bladeW, 4);
                ctx.fill();

                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // UI Texts
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px 'Rajdhani', sans-serif";
            ctx.fillText("SCORE: " + score, 20, 35);
            ctx.fillStyle = "#00f0ff";
            ctx.fillText("HIGH SCORE: " + highScore, 20, 60);

            // Overlays
            if (!gameStarted) {
                ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00f0ff";
                ctx.font = "bold 32px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f0ff";
                ctx.fillText("NEON CHOPPER: SKY BATTLE", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px 'Outfit', sans-serif";
                ctx.fillText("Move Mouse or Arrows to Start", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
                ctx.shadowBlur = 0;
            } else if (gameOver) {
                ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 34px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff0055";
                ctx.fillText("MISSION FAILED!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#00f0ff";
                ctx.font = "18px 'Outfit', sans-serif";
                ctx.fillText("Press Spacebar to Try Again", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign, "left";
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
