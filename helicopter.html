<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Heavy Cargo Chopper</title>
    <style>
        body { background: #030712; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Rajdhani', sans-serif; }
        canvas { background: linear-gradient(to bottom, #1e293b, #0f172a); border: 2px solid #00f0ff; border-radius: 10px; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>

<div class="ui-overlay">
    <div id="capacityBox" style="border: 2px solid #00f0ff; width: 200px; padding: 10px; background: rgba(0,0,0,0.5);">
        <div style="font-size: 14px; color: #00f0ff;">POWER CAPACITY</div>
        <div id="meterBar" style="height: 20px; background: #ff0055; width: 50%; transition: 0.2s;"></div>
        <div id="statusText" style="margin-top:5px; font-weight: bold;">NORMAL</div>
    </div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let heli = { x: 100, y: 225, vy: 0, weight: 0, maxCapacity: 100 };
    let items = []; // Cargo + Boosters
    let gameOver = false;

    // Game Loop
    function update() {
        if(gameOver) return;

        // Gravity/Physics
        heli.vy += 0.2; 
        heli.y += heli.vy;

        // Weight impact
        heli.vy += (heli.weight * 0.005); 

        // Collision Logic (Floor/Roof)
        if(heli.y > 430 || heli.y < 20) gameOver = true;

        // Spawn Items
        if(Math.random() < 0.02) {
            items.push({ x: 800, y: Math.random()*400, type: Math.random() > 0.3 ? 'cargo' : 'boost', val: Math.random()*20 });
        }

        items.forEach((item, index) => {
            item.x -= 3;
            // Collision
            if(Math.abs(item.x - heli.x) < 30 && Math.abs(item.y - heli.y) < 30) {
                if(item.type === 'cargo') heli.weight += item.val;
                else heli.maxCapacity += item.val; // Boost adds capacity
                items.splice(index, 1);
            }
        });

        // Check Explosion
        if(heli.weight > heli.maxCapacity) gameOver = true;

        // UI Update
        let percent = (heli.weight / heli.maxCapacity) * 100;
        document.getElementById('meterBar').style.width = Math.min(percent, 100) + "%";
        document.getElementById('meterBar').style.background = percent > 80 ? "#ff0055" : "#00f0ff";
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 450);
        // Draw Heli
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(heli.x, heli.y, 50, 20);
        // Draw Items
        items.forEach(i => {
            ctx.fillStyle = i.type === 'cargo' ? '#ffd700' : '#00ff00';
            ctx.fillRect(i.x, i.y, 20, 20);
        });
        requestAnimationFrame(() => { update(); draw(); });
    }

    window.onkeydown = () => { heli.vy = -5; };
    draw();
</script>
</body>
</html>
