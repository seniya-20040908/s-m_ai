<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Cargo Chopper</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff0055;
            --text-main: #f8fafc;
            --border-color: rgba(0, 240, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 10;
        }

        h1 {
            font-size: 1.3rem;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .game-container {
            position: relative;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 18px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
        }

        canvas {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            border-radius: 12px;
            display: block;
            cursor: pointer;
        }

        .controls-hint {
            margin-top: 10px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .controls-hint span {
            color: var(--accent-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="games.html" class="back-btn">&#8592; Back</a>
        <h1>Heavy Cargo Overload Chopper</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="controls-hint">
            <span>HOLD CLICK / SPACE</span> to Lift Cargo | Don't Overload or Hit Limits!
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highScore = localStorage.getItem("cargoChopperHighScore") || 0;
        let gameOver = false;
        let gameStarted = false;

        // Helicopter & Cargo Properties
        let heli = {
            x: 150,
            y: 200,
            w: 55,
            h: 26,
            vy: 0,
            lift: -0.35,
            gravity: 0.25,
            rotorAngle: 0,
            cargoWeight: 1 // මුලින් තියෙන සාමාන්‍ය බර
        };

        let cargos = [];
        let particles = [];
        let frameCount = 0;

        let isHolding = false;
        window.addEventListener("mousedown", () => { isHolding = true; if(!gameStarted) gameStarted = true; if(gameOver) resetGame(); });
        window.addEventListener("mouseup", () => { isHolding = false; });
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                isHolding = true;
                if(!gameStarted) gameStarted = true;
                if(gameOver) resetGame();
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") isHolding = false;
        });

        function resetGame() {
            heli.y = 200;
            heli.vy = 0;
            heli.cargoWeight = 1;
            cargos = [];
            particles = [];
            score = 0;
            frameCount = 0;
            gameOver = false;
        }

        function spawnCargo() {
            let weightVal = Math.floor(Math.random() * 3) + 1; // බර මට්ටම් 1 සිට 3 දක්වා
            cargos.push({
                x: canvas.width,
                y: canvas.height - 60,
                w: 30,
                h: 30,
                weight: weightVal
            });
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            if (!gameStarted) return;

            if (!gameOver) {
                frameCount++;
                score = Math.floor(frameCount / 6);

                // බර වැඩි වෙද්දී හෙලිකොප්ටරයට උඩට යන්න අමාරු වෙනවා (Gravity වැඩි වෙනවා)
                let effectiveGravity = heli.gravity + (heli.cargoWeight * 0.08);

                if (isHolding) {
                    heli.vy += heli.lift;
                    if(frameCount % 3 === 0) {
                        createParticles(heli.x - 15, heli.y + 12, "#00f0ff", 3);
                    }
                } else {
                    heli.vy += effectiveGravity;
                }

                heli.y += heli.vy;
                heli.rotorAngle += 0.4 + (heli.cargoWeight * 0.1);

                // Spawn Cargo Boxes
                if (frameCount % 90 === 0) {
                    spawnCargo();
                }

                // Move and hook cargos
                for (let i = cargos.length - 1; i >= 0; i--) {
                    cargos[i].x -= 3;

                    // හෙලිකොප්ටරය Cargo එක උඩින් යද්දී එකතු කරගන්නවා
                    let distX = heli.x - cargos[i].x;
                    let distY = (heli.y + heli.h) - cargos[i].y;
                    
                    if (Math.abs(distX) < 30 && Math.abs(distY) < 35) {
                        heli.cargoWeight += cargos[i].weight; // බර වැඩි වෙනවා!
                        createParticles(cargos[i].x, cargos[i].y, "#ffd700", 10);
                        
                        // බර සීමාව (Max Weight Limit) 5 පැනිය හැකිනම් මෙතනදී පුපුරලා යනවා!
                        if (heli.cargoWeight > 5) {
                            gameOver = true;
                            createParticles(heli.x, heli.y, "#ff0055", 25); // මාර විදිහට පුපුරලා යනවා
                        }

                        cargos.splice(i, 1);
                        score += 30;
                    } else if (cargos[i] && cargos[i].x + cargos[i].w < 0) {
                        cargos.splice(i, 1);
                    }
                }

                // බිම හෝ වහලේ වැදුනොත් හෝ ඕනෑවට වඩා බර උස්සලා හැප්පුනොත්
                if (heli.y - heli.h / 2 < 0 || heli.y + heli.h / 2 > canvas.height) {
                    gameOver = true;
                    createParticles(heli.x, heli.y, "#ff0055", 20);
                }

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("cargoChopperHighScore", highScore);
                }
            }

            // Particles update
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = "rgba(0, 240, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw Cargo Boxes on Ground
            cargos.forEach(c => {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ffd700";
                ctx.fillStyle = c.weight > 2 ? "#ff0055" : "#ffd700";
                ctx.fillRect(c.x, c.y, c.w, c.h);
                ctx.fillStyle = "#000";
                ctx.font = "bold 12px 'Rajdhani'";
                ctx.fillText("+" + c.weight + "T", c.x + 6, c.y + 20);
                ctx.restore();
            });

            // Draw Helicopter & Hanging Cargo Chain
            if (!gameOver || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.save();
                ctx.translate(heli.x, heli.y);

                // Body
                ctx.shadowBlur = 15;
                ctx.shadowColor = heli.cargoWeight > 4 ? "#ff0055" : "#00f0ff";
                ctx.fillStyle = heli.cargoWeight > 4 ? "#ff0055" : "#00f0ff";
                ctx.fillRect(-heli.w / 2, -heli.h / 2, heli.w, heli.h);

                // Cockpit Glass
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(5, -heli.h / 2 + 3, 15, heli.h - 6);

                // Tail
                ctx.fillStyle = heli.cargoWeight > 4 ? "#ff0055" : "#00f0ff";
                ctx.fillRect(-heli.w / 2 - 18, -4, 18, 6);

                // Rotor Blades (Faster when overloaded)
                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ffffff";
                ctx.beginPath();
                let bladeWidth = Math.cos(heli.rotorAngle) * 36;
                ctx.rect(-bladeWidth / 2, -heli.h / 2 - 8, bladeWidth, 4);
                ctx.fill();

                // Hanging Cargo Load Line if carrying weight
                if(heli.cargoWeight > 1) {
                    ctx.strokeStyle = "#ffd700";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, heli.h / 2);
                    ctx.lineTo(0, heli.h / 2 + 25);
                    ctx.stroke();

                    // Hanging Box
                    ctx.fillStyle = "#ffd700";
                    ctx.fillRect(-10, heli.h / 2 + 25, 20, 20);
                }

                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // UI Texts
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px 'Rajdhani', sans-serif";
            ctx.fillText("SCORE: " + score, 20, 35);
            ctx.fillStyle = "#ffd700";
            ctx.fillText("CARGO WEIGHT: " + (heli.cargoWeight - 1) * 2 + " Tons", 20, 60);

            // Overlays
            if (!gameStarted) {
                ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00f0ff";
                ctx.font = "bold 32px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f0ff";
                ctx.fillText("HEAVY CARGO CHOPPER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px 'Outfit', sans-serif";
                ctx.fillText("Click or Press Spacebar to Start", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
                ctx.shadowBlur = 0;
            } else if (gameOver) {
                ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 34px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff0055";
                ctx.fillText("OVERLOAD EXPLOSION! CRASHED!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#00f0ff";
                ctx.font = "18px 'Outfit', sans-serif";
                ctx.fillText("Click or Press Spacebar to Try Again", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
