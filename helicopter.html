<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Helicopter Cargo Game</title>
    <style>
        body { background: #030712; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        canvas { background: linear-gradient(to bottom, #1e293b, #090e1a); border: 4px solid #334155; border-radius: 15px; cursor: crosshair; }
        .ui-top { position: absolute; top: 20px; left: 20px; display: flex; gap: 20px; align-items: center; }
        .back-btn { padding: 10px 20px; background: #ff0055; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .gauge-container { width: 100px; height: 100px; border: 4px solid #fff; border-radius: 50%; position: relative; }
        #needle { width: 4px; height: 40px; background: #00f0ff; position: absolute; left: 48px; bottom: 50px; transform-origin: bottom; transition: 0.2s; }
    </style>
</head>
<body>

<div class="ui-top">
    <button class="back-btn" onclick="history.back()">BACK</button>
    <div class="gauge-container"><div id="needle"></div></div>
    <div>
        <h3>COINS: <span id="coinCount">0</span></h3>
        <button onclick="buyBoost()">BUY ENGINE BOOST (50 Coins)</button>
    </div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let heli = { x: 100, y: 225, vy: 0, weight: 0, maxCap: 100, coins: 0, rotor: 0 };
    let items = [];

    function buyBoost() {
        if(heli.coins >= 50) {
            heli.coins -= 50;
            heli.maxCap += 50;
            alert("Engine Boost Upgraded!");
        }
    }

    function drawHeli() {
        ctx.save();
        ctx.translate(heli.x, heli.y);
        // Body
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(-20, -10, 40, 20);
        // Tail
        ctx.fillRect(-40, -5, 20, 6);
        // Cockpit
        ctx.fillStyle = "#fff";
        ctx.fillRect(10, -8, 10, 10);
        // Rotor
        heli.rotor += 0.5;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(heli.rotor)*30, -15);
        ctx.lineTo(-Math.cos(heli.rotor)*30, -15);
        ctx.stroke();
        ctx.restore();
    }

    function update() {
        heli.vy += 0.15;
        heli.y += heli.vy;
        
        // Items logic
        if(Math.random() < 0.02) items.push({ x: 800, y: Math.random()*400, type: Math.random() > 0.5 ? 'coin' : 'cargo' });
        
        items.forEach((i, idx) => {
            i.x -= 3;
            if(Math.hypot(i.x - heli.x, i.y - heli.y) < 30) {
                if(i.type == 'coin') heli.coins += 10;
                else heli.weight += 10;
                items.splice(idx, 1);
            }
        });

        // Gauge
        let angle = (heli.weight / heli.maxCap) * 180 - 90;
        document.getElementById('needle').style.transform = `rotate(${angle}deg)`;
        document.getElementById('coinCount').innerText = heli.coins;
        
        if(heli.y > 450 || heli.weight > heli.maxCap) location.reload(); // Game Over
    }

    function render() {
        ctx.clearRect(0,0,800,450);
        drawHeli();
        items.forEach(i => {
            ctx.fillStyle = i.type == 'coin' ? '#ffd700' : '#ff0055';
            ctx.fillRect(i.x, i.y, 20, 20);
        });
        update();
        requestAnimationFrame(render);
    }

    window.onkeydown = () => heli.vy = -4;
    render();
</script>
</body>
</html>
