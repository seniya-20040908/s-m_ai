<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Screen Cargo Chopper</title>
    <style>
        body { margin: 0; background: #030712; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid #334155; cursor: pointer; background: linear-gradient(to bottom, #0f172a, #000); }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Full Screen Setup
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    let heli = { x: 100, y: 200, vy: 0, weight: 0, maxCap: 100, coins: 0, rotor: 0, dead: false };
    let items = [];

    function drawUI() {
        // Back Button
        ctx.fillStyle = "#ff0055"; ctx.fillRect(20, 20, 100, 40);
        ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial"; ctx.fillText("← BACK", 35, 47);
        
        // Gauge
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(canvas.width - 80, 80, 50, 0, Math.PI*2); ctx.stroke();
        let angle = (heli.weight / heli.maxCap) * Math.PI - Math.PI/2;
        ctx.strokeStyle = "#00f0ff"; ctx.beginPath(); ctx.moveTo(canvas.width - 80, 80); 
        ctx.lineTo(canvas.width - 80 + Math.cos(angle)*45, 80 + Math.sin(angle)*45); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.fillText("COINS: " + heli.coins, canvas.width - 120, 160);
    }

    function update() {
        if(heli.dead) return;
        heli.vy += 0.15; heli.y += heli.vy;
        
        if(Math.random() < 0.02) items.push({ x: canvas.width, y: Math.random()*(canvas.height-100)+50, type: Math.random() > 0.5 ? 'coin' : 'cargo' });
        
        items.forEach((i, idx) => {
            i.x -= 4;
            if(Math.hypot(i.x - heli.x, i.y - heli.y) < 40) {
                if(i.type == 'coin') heli.coins += 10;
                else heli.weight += 10;
                items.splice(idx, 1);
            }
        });

        if(heli.y > canvas.height - 20 || heli.weight > heli.maxCap) heli.dead = true;
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawUI();
        
        // Helicopter
        ctx.save(); ctx.translate(heli.x, heli.y);
        ctx.fillStyle = "#00f0ff"; ctx.fillRect(-25, -12, 50, 24); // Body
        ctx.fillRect(-50, -6, 25, 8); // Tail
        heli.rotor += 0.5;
        ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(Math.cos(heli.rotor)*40, -20);
        ctx.lineTo(-Math.cos(heli.rotor)*40, -20); ctx.stroke();
        ctx.restore();

        items.forEach(i => { ctx.fillStyle = i.type == 'coin' ? '#ffd700' : '#ff0055'; ctx.fillRect(i.x, i.y, 25, 25); });
        
        if(heli.dead) {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; ctx.font = "50px Arial"; ctx.fillText("GAME OVER - Click to Restart", canvas.width/2 - 300, canvas.height/2);
        }
        
        update();
        requestAnimationFrame(render);
    }

    canvas.onclick = (e) => {
        if(heli.dead) { heli.y=200; heli.vy=0; heli.weight=0; heli.coins=0; heli.dead=false; }
        else if(e.offsetX > 20 && e.offsetX < 120 && e.offsetY > 20 && e.offsetY < 60) window.history.back();
        else heli.vy = -5;
    };
    render();
</script>
</body>
</html>
