<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Cargo Chopper</title>
    <style>
        body { background: #030712; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Rajdhani', sans-serif; }
        canvas { background: radial-gradient(circle, #1e293b, #090e1a); border: 2px solid #334155; border-radius: 12px; }
        .ui-panel { position: absolute; top: 20px; left: 20px; text-align: center; }
        /* රවුම් මීටරය සඳහා CSS */
        .gauge-container { position: relative; width: 120px; height: 120px; background: #0f172a; border-radius: 50%; border: 4px solid #334155; }
        #needle { position: absolute; top: 50%; left: 50%; width: 4px; height: 50px; background: #ff0055; transform-origin: bottom; transform: rotate(-90deg); transition: 0.3s; }
    </style>
</head>
<body>

<div class="ui-panel">
    <div class="gauge-container">
        <div id="needle"></div>
    </div>
    <div style="margin-top: 10px; font-weight: bold; color: #00f0ff;">CAPACITY</div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let heli = { x: 100, y: 225, vy: 0, weight: 0, maxCapacity: 100 };
    let items = [];
    let gameOver = false;

    // Needle rotation (Gauge -90deg to +90deg)
    function updateGauge() {
        let percent = (heli.weight / heli.maxCapacity) * 180;
        document.getElementById('needle').style.transform = `rotate(${percent - 90}deg)`;
        if(heli.weight > heli.maxCapacity) document.getElementById('needle').style.background = "#ff0055";
        else document.getElementById('needle').style.background = "#00f0ff";
    }

    function update() {
        if(gameOver) return;
        heli.vy += 0.15; // Gravity
        heli.y += heli.vy;
        
        // Spawn Items
        if(Math.random() < 0.02) {
            items.push({ x: 800, y: Math.random()*400, type: Math.random() > 0.5 ? 'cargo' : 'boost', val: 15 });
        }

        items.forEach((item, index) => {
            item.x -= 4;
            if(Math.hypot(item.x - heli.x, item.y - heli.y) < 30) {
                if(item.type === 'cargo') heli.weight += item.val;
                else heli.maxCapacity += item.val;
                items.splice(index, 1);
            }
        });

        if(heli.y > 430 || heli.y < 20 || heli.weight > heli.maxCapacity) gameOver = true;
        updateGauge();
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 450);
        // Helicopter
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(heli.x, heli.y, 40, 20);
        // Items
        items.forEach(i => {
            ctx.fillStyle = i.type === 'cargo' ? '#ffd700' : '#00f0ff';
            ctx.fillRect(i.x, i.y, 25, 25);
        });
        requestAnimationFrame(() => { update(); draw(); });
    }

    window.onkeydown = () => { heli.vy = -4; };
    draw();
</script>
</body>
</html>
