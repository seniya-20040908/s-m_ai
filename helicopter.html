<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER CARGO COMMAND - ELITE EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff0055;
            --bg: #030712;
            --panel: #0f172a;
            --text: #ffffff;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        #game-container { width: 950px; background: var(--panel); padding: 20px; border: 2px solid var(--primary); border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        h2 { color: var(--primary); margin: 0; letter-spacing: 2px; }
        button { padding: 10px 20px; background: #1e293b; border: 1px solid var(--primary); color: var(--primary); cursor: pointer; border-radius: 5px; font-weight: bold; font-family: 'Rajdhani', sans-serif; transition: 0.3s; }
        button:hover { background: var(--primary); color: var(--bg); }
        #gameCanvas { background: #030712; display: block; border-radius: 5px; cursor: crosshair; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <button onclick="window.history.back()">← Games Hub</button>
        <h2>CYBER CARGO COMMAND</h2>
        <button onclick="toggleFS()">FULL SCREEN</button>
    </div>
    <canvas id="gameCanvas" width="910" height="400"></canvas>
    <div class="controls">
        <button id="liftBtn">▲ LIFT (Space)</button>
        <button onclick="buyBoost()">⚡ BOOST (B - 50 Coins)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let heli = { x: 150, y: 200, vy: 0, weight: 0, maxCap: 100, coins: 0, rotor: 0, dead: false };
    let items = [];
    let obstacles = [];
    let gameSpeed = 4;

    function toggleFS() {
        const container = document.getElementById('game-container');
        if (!document.fullscreenElement) container.requestFullscreen();
        else document.exitFullscreen();
    }

    function buyBoost() {
        if(heli.coins >= 50) {
            heli.coins -= 50;
            heli.maxCap += 50;
        }
    }

    function drawGauge() {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(850, 60, 35, 0, Math.PI * 2);
        ctx.stroke();

        let angle = (heli.weight / heli.maxCap) * Math.PI - Math.PI / 2;
        ctx.strokeStyle = (heli.weight > heli.maxCap * 0.8) ? "#ff0055" : "#00f0ff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(850, 60);
        ctx.lineTo(850 + Math.cos(angle) * 30, 60 + Math.sin(angle) * 30);
        ctx.stroke();
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "12px Rajdhani";
        ctx.fillText("CAPACITY", 820, 110);
    }

    function drawHeli() {
        ctx.save();
        ctx.translate(heli.x, heli.y);
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00f0ff";
        
        // Body
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(-20, -10, 40, 20);
        // Tail
        ctx.fillRect(-40, -5, 20, 6);
        // Cockpit
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(10, -8, 10, 10);
        
        // Rotor
        heli.rotor += 0.5;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(heli.rotor) * 30, -15);
        ctx.lineTo(-Math.cos(heli.rotor) * 30, -15);
        ctx.stroke();
        ctx.restore();
    }

    function renderLoop() {
        ctx.clearRect(0, 0, 910, 400);
        
        // Background Grid
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        for(let i=0; i<910; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke(); }
        for(let i=0; i<400; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(910,i); ctx.stroke(); }

        drawGauge();
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Rajdhani";
        ctx.fillText("COINS: " + heli.coins, 20, 30);

        if(!heli.dead) {
            drawHeli();
            
            // Adjust speed slightly as coins increase (Progressive Difficulty)
            gameSpeed = 4 + Math.floor(heli.coins / 50) * 0.5;

            // Obstacles Spawning & Moving
            if(Math.random() < 0.018) {
                let gapHeight = 140; // Size of the opening
                let topHeight = Math.random() * 150 + 40;
                obstacles.push({
                    x: 910,
                    top: topHeight,
                    bottom: topHeight + gapHeight,
                    width: 50,
                    passed: false
                });
            }

            obstacles.forEach((obs, idx) => {
                obs.x -= gameSpeed;
                
                // Draw Obstacles (Neon pillars)
                ctx.fillStyle = "#1e293b";
                ctx.strokeStyle = "#ff0055";
                ctx.lineWidth = 2;
                
                // Top Pillar
                ctx.fillRect(obs.x, 0, obs.width, obs.top);
                ctx.strokeRect(obs.x, 0, obs.width, obs.top);
                
                // Bottom Pillar
                ctx.fillRect(obs.x, obs.bottom, obs.width, 400 - obs.bottom);
                ctx.strokeRect(obs.x, obs.bottom, obs.width, 400 - obs.bottom);

                // Collision Detection with Obstacles
                if (heli.x + 20 > obs.x && heli.x - 20 < obs.x + obs.width) {
                    if (heli.y - 10 < obs.top || heli.y + 10 > obs.bottom) {
                        heli.dead = true;
                    }
                }

                // Remove off-screen obstacles
                if (obs.x < -60) obstacles.splice(idx, 1);
            });

            // Items (Coins & Cargo)
            items.forEach((i, idx) => {
                ctx.fillStyle = (i.type === 'coin') ? "#ffd700" : "#ff0055";
                ctx.fillRect(i.x, i.y, 25, 25);
                i.x -= gameSpeed;
                if(Math.hypot(i.x - heli.x, i.y - heli.y) < 30) {
                    if(i.type === 'coin') heli.coins += 10; else heli.weight += 10;
                    items.splice(idx, 1);
                }
            });

            if(Math.random() < 0.02) items.push({ x: 910, y: Math.random() * 350, type: (Math.random() > 0.5) ? 'coin' : 'cargo' });

            heli.vy += 0.15;
            heli.y += heli.vy;

            // Boundaries & Weight Check
            if(heli.y > 390 || heli.y < 10 || heli.weight > heli.maxCap) {
                heli.dead = true;
            }
        } else {
            ctx.fillStyle = "rgba(255, 0, 85, 0.2)";
            ctx.fillRect(0, 0, 910, 400);
            ctx.fillStyle = "#ffffff";
            ctx.font = "50px Rajdhani";
            ctx.textAlign = "center";
            ctx.fillText("CRASHED! Click to Restart", 455, 200);
        }

        requestAnimationFrame(renderLoop);
    }

    canvas.onclick = () => {
        if(heli.dead) {
            heli = { x: 150, y: 200, vy: 0, weight: 0, maxCap: 100, coins: 0, rotor: 0, dead: false };
            items = [];
            obstacles = [];
        } else {
            heli.vy = -5;
        }
    };

    document.getElementById('liftBtn').onmousedown = () => { if(!heli.dead) heli.vy = -5; };
    window.onkeydown = (e) => { 
        if(!heli.dead) {
            if(e.code === 'Space') heli.vy = -5; 
            if(e.key === 'b' || e.key === 'B') buyBoost(); 
        }
    };
    
    renderLoop();
</script>
</body>
</html>
