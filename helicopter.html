<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER CHOPPER WARFARE - ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff0055;
            --bg: #030712;
            --panel: #0f172a;
            --text: #ffffff;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        #game-container { width: 950px; background: var(--panel); padding: 20px; border: 2px solid var(--primary); border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); display: flex; flex-direction: column; align-items: center; }
        #game-container:fullscreen { width: 100vw; height: 100vh; max-width: none; border: none; border-radius: 0; padding: 10px; box-sizing: border-box; justify-content: center; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; box-sizing: border-box; }
        h2 { color: var(--primary); margin: 0; letter-spacing: 2px; }
        button { padding: 10px 20px; background: #1e293b; border: 1px solid var(--primary); color: var(--primary); cursor: pointer; border-radius: 5px; font-weight: bold; font-family: 'Rajdhani', sans-serif; transition: 0.3s; }
        button:hover { background: var(--primary); color: var(--bg); }
        #gameCanvas { background: #030712; display: block; border-radius: 5px; cursor: crosshair; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); width: 910px; height: 400px; }
        #game-container:fullscreen #gameCanvas { width: 100%; height: calc(100vh - 100px); max-height: 85vh; }
        .controls-info { text-align: center; margin-top: 10px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <button onclick="window.history.back()">← Games Hub</button>
        <h2>CYBER CHOPPER WARFARE</h2>
        <button onclick="toggleFS()">FULL SCREEN</button>
    </div>
    <canvas id="gameCanvas" width="910" height="400"></canvas>
    <div class="controls-info">Move: Arrow Keys | Shoot Down: Shift Key | Dodge Enemy Missiles!</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let heli = { x: 100, y: 150, width: 50, height: 22, speed: 5, hp: 100, maxHp: 100, rotor: 0, dead: false };
    let bullets = [];      
    let missiles = [];     
    let trucks = [];       
    let score = 0;
    let keys = {};

    function toggleFS() {
        const container = document.getElementById('game-container');
        if (!document.fullscreenElement) container.requestFullscreen();
        else document.exitFullscreen();
    }

    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        // Shoot using Shift key
        if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
            if(!heli.dead) {
                bullets.push({ x: heli.x + heli.width/2, y: heli.y + heli.height, speed: 7 });
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    function spawnTruck() {
        if(Math.random() < 0.018) {
            trucks.push({
                x: canvas.width,
                y: canvas.height - 35,
                width: 50,
                height: 25,
                speed: 3,
                shootTimer: 0
            });
        }
    }

    function update() {
        if(heli.dead) return;

        // Freedom of movement across the entire screen boundaries
        if(keys['ArrowUp'] && heli.y > 10) heli.y -= heli.speed;
        if(keys['ArrowDown'] && heli.y < canvas.height - heli.height - 15) heli.y += heli.speed;
        if(keys['ArrowLeft'] && heli.x > 10) heli.x -= heli.speed;
        if(keys['ArrowRight'] && heli.x < canvas.width - heli.width - 10) heli.x += heli.speed;

        bullets.forEach((b, index) => {
            b.y += b.speed;
            if(b.y > canvas.height) bullets.splice(index, 1);
        });

        trucks.forEach((t, tIndex) => {
            t.x -= t.speed;
            t.shootTimer++;

            if(t.shootTimer > 70) {
                missiles.push({ x: t.x + t.width/2, y: t.y, speed: 4.5 });
                t.shootTimer = 0;
            }

            bullets.forEach((b, bIndex) => {
                if(b.x > t.x && b.x < t.x + t.width && b.y > t.y && b.y < t.y + t.height) {
                    trucks.splice(tIndex, 1);
                    bullets.splice(bIndex, 1);
                    score += 150;
                }
            });

            if(t.x < -60) trucks.splice(tIndex, 1);
        });

        missiles.forEach((m, mIndex) => {
            m.y -= m.speed;

            if(m.x > heli.x && m.x < heli.x + heli.width && m.y > heli.y && m.y < heli.y + heli.height) {
                heli.hp -= 25;
                missiles.splice(mIndex, 1);
                if(heli.hp <= 0) {
                    heli.dead = true;
                }
            }

            if(m.y < 0) missiles.splice(mIndex, 1);
        });

        spawnTruck();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 240, 255, 0.05)";
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
        
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

        if(!heli.dead) {
            ctx.save();
            ctx.translate(heli.x, heli.y);
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#00f0ff";
            
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(-22, -8, 44, 18);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(6, -6, 14, 12);

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(-38, -4, 18, 6);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(-38, -10, 4, 12);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-15, 14); ctx.lineTo(15, 14);
            ctx.moveTo(-10, 10); ctx.lineTo(-15, 14);
            ctx.moveTo(10, 10); ctx.lineTo(15, 14);
            ctx.stroke();

            heli.rotor += 0.7;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(Math.cos(heli.rotor) * 32, -13);
            ctx.lineTo(-Math.cos(heli.rotor) * 32, -13);
            ctx.stroke();

            ctx.restore();
        }

        ctx.shadowColor = "#ff0055";
        trucks.forEach(t => {
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(t.x, t.y, t.width, t.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(t.x + 18, t.y - 8, 8, 10);
        });

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00f0ff";
        ctx.fillStyle = "#00f0ff";
        bullets.forEach(b => {
            ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
        });

        ctx.shadowColor = "#ff0055";
        ctx.fillStyle = "#ff0055";
        missiles.forEach(m => {
            ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, Math.PI*2); ctx.fill();
        });

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Rajdhani'";
        ctx.fillText("SCORE: " + score, 20, 30);
        
        ctx.fillText("HP: ", canvas.height > 500 ? canvas.width - 160 : 750, 30);
        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.height > 500 ? canvas.width - 130 : 780, 15, 110, 20);
        ctx.fillStyle = "#ff0055";
        let hpWidth = (heli.hp / heli.maxHp) * 106;
        if(hpWidth < 0) hpWidth = 0;
        ctx.fillRect(canvas.height > 500 ? canvas.width - 128 : 782, 17, hpWidth, 16);

        if(heli.dead) {
            ctx.fillStyle = "rgba(255, 0, 85, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 45px 'Rajdhani'";
            ctx.textAlign = "center";
            ctx.fillText("HELICOPTER DESTROYED!", canvas.width/2, canvas.height/2 - 20);
            
            ctx.font = "20px 'Rajdhani'";
            ctx.fillStyle = "#00f0ff";
            ctx.fillText("Click anywhere to Respawn", canvas.width/2, canvas.height/2 + 20);
            ctx.textAlign = "left";
        }

        update();
        requestAnimationFrame(render);
    }

    canvas.onclick = () => {
        if(heli.dead) {
            heli.hp = 100;
            heli.dead = false;
            heli.y = 150;
            trucks = [];
            bullets = [];
            missiles = [];
            score = 0;
        }
    };

    render();
</script>
</body>
</html>
