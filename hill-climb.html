<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hill Climb - AI Games Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            max-width: 1100px;
            margin: 10px auto;
            border-radius: 12px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 95%;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Fullscreen styles for game container */
        .game-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .game-container:fullscreen {
            width: 100vw;
            height: 100vh;
            padding: 0;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #020617;
        }

        .game-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            padding: 0;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #020617;
        }

        canvas {
            background: linear-gradient(to bottom, #020617, #0f172a, #1e1b4b);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            display: block;
            width: 100%;
            max-width: 760px;
            height: 420px;
        }

        .game-container:fullscreen canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: none;
            border: none;
            border-radius: 0;
        }

        .game-container:-webkit-full-screen canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: none;
            border: none;
            border-radius: 0;
        }

        .upgrade-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upgrade-panel h3 {
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-cyan);
            font-size: 1.3rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .upgrade-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .controls-info {
            margin-top: 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-info span {
            color: var(--accent-cyan);
            font-weight: bold;
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .fullscreen-btn {
            background: var(--accent-cyan);
            border: none;
            color: #000;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .fullscreen-btn:hover {
            box-shadow: 0 0 10px var(--accent-cyan);
        }
    </style>
</head>
<body>

    <header>
        <a href="games.html" class="back-btn">&#8592; Back</a>
        <h1>Cyber Hill Climb: Neon Edition</h1>
        <div style="width: 70px;"></div>
    </header>

    <div class="game-wrapper">
        <div class="game-container" id="gameBox">
            <canvas id="gameCanvas" width="760" height="420"></canvas>
            <div class="controls-info">
                <span>Arrows</span>: Drive & Balance | <span>SPACE</span>: Restart
                <button class="fullscreen-btn" onclick="toggleFullScreen()">Full Screen ⛶</button>
            </div>
        </div>

        <div class="upgrade-panel">
            <h3>Gadgets & Upgrades</h3>
            <div id="coinDisplay" style="font-weight: bold; color: #fbbf24; font-size: 1.1rem;">Coins: 🪙 0</div>
            
            <button class="upgrade-btn" onclick="buyUpgrade('engine')">
                <span>⚡ Turbo Engine</span>
                <span id="costEngine" style="font-size: 0.85rem; color: var(--accent-cyan);">20 Coins</span>
            </button>
            <button class="upgrade-btn" onclick="buyUpgrade('tires')">
                <span>🛞 Grip Tires</span>
                <span id="costTires" style="font-size: 0.85rem; color: var(--accent-cyan);">15 Coins</span>
            </button>
            <button class="upgrade-btn" onclick="buyUpgrade('gyro')">
                <span>🛡️ Auto-Balance</span>
                <span id="costGyro" style="font-size: 0.85rem; color: var(--accent-cyan);">30 Coins</span>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let coins = 0;
        let gameOver = false;
        let cameraX = 0;
        let cameraY = 0;
        let explosionParticles = [];

        let upgrades = {
            engine: { level: 1, cost: 20 },
            tires: { level: 1, cost: 15 },
            gyro: { level: 0, cost: 30 }
        };

        let car = {
            x: 100,
            y: 200,
            vx: 0,
            vy: 0,
            angle: 0,
            width: 55,
            height: 28,
            power: 0.22,
            gravity: 0.28,
            friction: 0.985
        };

        let keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code === "Space" && gameOver) {
                resetGame();
            }
        });
        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        let terrain = [];
        let coinList = [];
        for (let i = 0; i < 3000; i++) {
            let height = 280 + Math.sin(i * 0.025) * 80 + Math.cos(i * 0.01) * 120;
            terrain.push({ x: i * 15, y: height });
            
            if (i % 5 === 0 && i > 5) {
                coinList.push({ x: i * 15, y: height - 35, collected: false });
            }
        }

        function getTerrainHeight(x) {
            let index = Math.floor(x / 15);
            if (index < 0) return terrain[0].y;
            if (index >= terrain.length - 1) return terrain[terrain.length - 1].y;
            
            let p1 = terrain[index];
            let p2 = terrain[index + 1];
            let t = (x - p1.x) / (p2.x - p1.x);
            return p1.y + t * (p2.y - p1.y);
        }

        function buyUpgrade(type) {
            if (coins >= upgrades[type].cost) {
                coins -= upgrades[type].cost;
                upgrades[type].level++;
                upgrades[type].cost = Math.floor(upgrades[type].cost * 1.5);

                if (type === 'engine') car.power += 0.06;
                if (type === 'tires') car.friction += 0.003;
                if (type === 'gyro') car.gyroActive = true;

                updateUI();
            }
        }

        function updateUI() {
            document.getElementById("coinDisplay").innerText = "Coins: 🪙 " + coins;
            document.getElementById("costEngine").innerText = upgrades.engine.cost + " Coins";
            document.getElementById("costTires").innerText = upgrades.tires.cost + " Coins";
            document.getElementById("costGyro").innerText = upgrades.gyro.level > 0 ? "MAX" : upgrades.gyro.cost + " Coins";
        }

        function triggerExplosion(x, y) {
            gameOver = true;
            explosionParticles = [];
            for (let i = 0; i < 50; i++) {
                explosionParticles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    radius: Math.random() * 4 + 2,
                    color: Math.random() > 0.5 ? "#ff0055" : "#fbbf24",
                    alpha: 1
                });
            }
        }

        function resetGame() {
            car.x = 100;
            car.y = 200;
            car.vx = 0;
            car.vy = 0;
            car.angle = 0;
            cameraX = 0;
            cameraY = 0;
            score = 0;
            gameOver = false;
            explosionParticles = [];
        }

        function toggleFullScreen() {
            let elem = document.getElementById("gameBox");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        // Automatically resize canvas drawing resolution when entering/exiting fullscreen
        document.addEventListener("fullscreenchange", handleFullscreenResize);
        document.addEventListener("webkitfullscreenchange", handleFullscreenResize);

        function handleFullscreenResize() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight - 60; // leave space for controls bar
            } else {
                canvas.width = 760;
                canvas.height = 420;
            }
        }

        function update() {
            if (!gameOver) {
                if (keys["ArrowRight"]) {
                    car.vx += car.power;
                }
                if (keys["ArrowLeft"]) {
                    car.vx -= car.power * 0.6;
                }

                car.vy += car.gravity;
                car.vx *= car.friction;
                car.x += car.vx;

                let groundY = getTerrainHeight(car.x);

                if (car.y >= groundY - 14) {
                    car.y = groundY - 14;
                    car.vy = 0;
                    
                    let nextGroundY = getTerrainHeight(car.x + 12);
                    let slope = (nextGroundY - groundY) / 12;
                    let targetAngle = Math.atan(slope);

                    car.angle += (targetAngle - car.angle) * 0.2;

                    if (keys["ArrowRight"] && car.vx > 0) {
                        car.vy = -slope * car.vx * 0.55;
                    }
                } else {
                    car.y += car.vy;
                    if (keys["ArrowRight"]) car.angle += 0.06;
                    if (keys["ArrowLeft"]) car.angle -= 0.06;
                    
                    if (upgrades.gyro.level > 0) {
                        car.angle *= 0.95; 
                    }
                }

                let targetCameraX = car.x - canvas.width / 2.5;
                let targetCameraY = car.y - canvas.height / 2;
                cameraX += (targetCameraX - cameraX) * 0.1;
                cameraY += (targetCameraY - cameraY) * 0.1;

                score = Math.floor(car.x / 10);

                coinList.forEach(coin => {
                    if (!coin.collected) {
                        let dist = Math.hypot(car.x - coin.x, car.y - coin.y);
                        if (dist < 25) {
                            coin.collected = true;
                            coins += 5;
                            updateUI();
                        }
                    }
                });

                if (Math.abs(car.angle) > 1.55) {
                    triggerExplosion(car.x, car.y);
                }
            } else {
                explosionParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.02;
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            ctx.strokeStyle = "rgba(0, 240, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let i = Math.floor(cameraX / 50) * 50; i < cameraX + canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, cameraY);
                ctx.lineTo(i, cameraY + canvas.height);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(terrain[0].x, terrain[0].y + 1000);
            for (let i = 0; i < terrain.length; i++) {
                ctx.lineTo(terrain[i].x, terrain[i].y);
            }
            ctx.lineTo(terrain[terrain.length - 1].x, terrain[terrain.length - 1].y + 1000);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00f0ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.stroke();
            ctx.shadowBlur = 0;

            coinList.forEach(coin => {
                if (!coin.collected && coin.x > cameraX - 50 && coin.x < cameraX + canvas.width + 50) {
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, 7, 0, Math.PI * 2);
                    ctx.fillStyle = "#fbbf24";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#fbbf24";
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            if (!gameOver) {
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle);

                ctx.fillStyle = "#ff0055";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff0055";
                ctx.fillRect(-car.width / 2, -car.height, car.width, car.height - 6);
                
                ctx.fillStyle = "#00f0ff";
                ctx.fillRect(-car.width / 4, -car.height - 10, car.width / 2, 10);
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(-car.width / 3, 4, 9, 0, Math.PI * 2);
                ctx.arc(car.width / 3, 4, 9, 0, Math.PI * 2);
                ctx.fillStyle = "#1e293b";
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth.width = 3;
                ctx.lineWidth = 3;
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            } else {
                explosionParticles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(p.alpha, 0);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.restore();
                });
            }

            ctx.restore();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Outfit', sans-serif";
            ctx.fillText("Score: " + score, 20, 35);
            ctx.fillStyle = "#fbbf24";
            ctx.fillText("Coins: 🪙 " + coins, 20, 60);

            if (gameOver) {
                ctx.fillStyle = "rgba(7, 10, 15, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 32px 'Rajdhani', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff0055";
                ctx.fillText("CRASHED & BURNED!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#00f0ff";
                ctx.font = "18px 'Outfit', sans-serif";
                ctx.fillText("Press SPACEBAR to Restart", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign, ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
