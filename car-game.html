<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Car Race with Nitro - Seni & Mahe AI Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-cyan: #0284c7;
            --accent-purple: #7c3aed;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(2, 132, 199, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0 0 16px 16px;
        }

        .back-btn {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .game-container {
            margin: 1.5rem 0;
            text-align: center;
        }

        .game-ui {
            display: flex;
            justify-content: space-between;
            width: 550px;
            max-width: 100%;
            margin: 0 auto 10px auto;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-cyan);
        }

        canvas {
            background: #111;
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.3);
            display: block;
            margin: 0 auto;
        }

        .controls-hint {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .nitro-status {
            color: #00f0ff;
            font-weight: bold;
            text-shadow: 0 0 10px #00f0ff;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .control-btn {
            background: var(--card-bg);
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 1.3rem;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .control-btn:active {
            background: var(--accent-cyan);
            color: #000;
        }

        @media (max-width: 600px) {
            .mobile-controls {
                display: flex;
            }
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">Cyber <span>Car Race</span></div>
        <a href="games.html" class="back-btn">← Back to Games Hub</a>
    </header>

    <div class="game-container">
        <div class="game-ui" style="width: 550px;">
            <span id="scoreDisplay">SCORE: 0</span>
            <span id="levelDisplay">LEVEL: 1</span>
            <span id="nitroDisplay">NITRO [SHIFT]: <span class="nitro-status">READY</span></span>
            <span id="livesDisplay">LIVES: ❤️❤️❤️</span>
        </div>
        
        <!-- Full Screen Larger Canvas -->
        <canvas id="gameCanvas" width="550" height="650"></canvas>
        
        <div class="controls-hint">Use Left/Right Arrow Keys (A/D) to steer. Hold <b>SHIFT</b> to activate NITRO Boost!</div>

        <div class="mobile-controls">
            <button class="control-btn" id="leftBtn">◀ STEER</button>
            <button class="control-btn" id="nitroBtn" style="border-color: #ff00ff; color: #ff00ff;">⚡ NITRO</button>
            <button class="control-btn" id="rightBtn">STEER ▶</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Seni & Mahe AI Creations. All rights reserved.
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const nitroDisplay = document.getElementById('nitroDisplay');

        let score = 0;
        let level = 1;
        let lives = 3;
        let gameOver = false;
        let gameSpeed = 5;
        let baseSpeed = 5;
        let roadLineOffset = 0;

        // Nitro Variables
        let nitroActive = false;
        let nitroCharge = 100; // Max 100%

        // Player Car
        const player = {
            x: 235,
            y: 520,
            width: 55,
            height: 100,
            speed: 7,
            color: '#00f0ff'
        };

        let trafficCars = [];
        let keys = {};

        window.addEventListener('keydown', (e) => { 
            keys[e.key] = true; 
            if (e.key === 'Shift') nitroActive = true;
        });
        
        window.addEventListener('keyup', (e) => { 
            keys[e.key] = false; 
            if (e.key === 'Shift') nitroActive = false;
        });

        // Mobile Controls Listeners
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const nitroBtn = document.getElementById('nitroBtn');

        if(leftBtn && rightBtn && nitroBtn) {
            leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
            leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowLeft'] = false; });
            rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
            rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowRight'] = false; });
            
            nitroBtn.addEventListener('touchstart', (e) => { e.preventDefault(); nitroActive = true; });
            nitroBtn.addEventListener('touchend', (e) => { e.preventDefault(); nitroActive = false; });
        }

        function spawnTraffic() {
            if (Math.random() < 0.022 + (level * 0.004)) {
                const lanes = [50, 170, 290, 410];
                const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                trafficCars.push({
                    x: laneX,
                    y: -120,
                    width: 55,
                    height: 100,
                    speed: baseSpeed + Math.random() * 2,
                    color: '#ff0055'
                });
            }
        }

        function drawCar(x, y, width, height, color, isPlayer = false, isNitro = false) {
            ctx.save();
            ctx.shadowBlur = isNitro ? 25 : 15;
            ctx.shadowColor = isNitro ? '#00f0ff' : color;
            ctx.fillStyle = color;

            // Car Body
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 12);
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#070a0f';
            ctx.fillRect(x + 8, y + 22, width - 16, 25);

            // Roof & details
            ctx.fillStyle = color;
            ctx.fillRect(x + 10, y + 48, width - 20, 25);

            // Headlights / Taillights
            ctx.fillStyle = isPlayer ? '#ffffff' : '#ffff00';
            ctx.fillRect(x + 6, y + 3, 8, 4);
            ctx.fillRect(x + width - 14, y + 3, 8, 4);

            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 6, y + height - 7, 8, 4);
            ctx.fillRect(x + width - 14, y + height - 7, 8, 4);

            // Nitro Flame Effect at back
            if (isNitro && isPlayer) {
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 30;
                ctx.fillRect(x + 12, y + height, 10, 18);
                ctx.fillRect(x + width - 22, y + height, 10, 18);
            }

            ctx.restore();
        }

        function drawRoad() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Side Borders
            ctx.strokeStyle = nitroActive ? '#00f0ff' : '#334155';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(20, canvas.height);
            ctx.moveTo(canvas.width - 20, 0); ctx.lineTo(canvas.width - 20, canvas.height);
            ctx.stroke();

            // Center Lanes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.lineDashOffset = -roadLineOffset;

            ctx.beginPath();
            ctx.moveTo(140, 0); ctx.lineTo(140, canvas.height);
            ctx.moveTo(275, 0); ctx.lineTo(275, canvas.height);
            ctx.moveTo(410, 0); ctx.lineTo(410, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver) return;

            // Handle Nitro Logic
            if (nitroActive && nitroCharge > 0) {
                gameSpeed = baseSpeed * 2.2;
                nitroCharge -= 1.2; // Drain nitro
            } else {
                gameSpeed = baseSpeed + (level - 1) * 0.8;
                if (nitroCharge < 100) nitroCharge += 0.4; // Recharge slowly
            }

            let nitroPercent = Math.floor(nitroCharge);
            nitroDisplay.innerHTML = `NITRO [SHIFT]: <span class="nitro-status">${nitroPercent}%</span>`;

            roadLineOffset += gameSpeed;

            // Player Steering
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 30) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width - 30) {
                player.x += player.speed;
            }

            spawnTraffic();
            for (let i = trafficCars.length - 1; i >= 0; i--) {
                trafficCars[i].y += trafficCars[i].speed + (nitroActive ? 2 : 0);

                if (checkCollision(player, trafficCars[i])) {
                    lives--;
                    trafficCars.splice(i, 1);
                    updateLivesUI();
                    if (lives <= 0) gameOver = true;
                    continue;
                }

                if (trafficCars[i].y > canvas.height) {
                    trafficCars.splice(i, 1);
                    score += nitroActive ? 20 : 10; // Double score during nitro!
                    scoreDisplay.innerText = "SCORE: " + score;

                    if (score >= level * 120) {
                        level++;
                        baseSpeed += 1;
                        levelDisplay.innerText = "LEVEL: " + level;
                    }
                }
            }
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesDisplay.innerText = "LIVES: " + hearts;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            trafficCars.forEach(car => {
                drawCar(car.x, car.y, car.width, car.height, car.color, false);
            });

            drawCar(player.x, player.y, player.width, player.height, player.color, true, nitroActive);

            if (gameOver) {
                ctx.fillStyle = 'rgba(7, 10, 15, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 40px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '20px Outfit';
                ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = '#00f0ff';
                ctx.font = '16px Outfit';
                ctx.fillText('Click Here to Restart', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) {
                score = 0;
                level = 1;
                lives = 3;
                baseSpeed = 5;
                nitroCharge = 100;
                trafficCars = [];
                gameOver = false;
                scoreDisplay.innerText = "SCORE: 0";
                levelDisplay.innerText = "LEVEL: 1";
                updateLivesUI();
            }
        });

        loop();
    </script>
</body>
</html>
