<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter AI - Seni & Mahe AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0f172a;
            --accent-cyan: #00f0ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            position: relative;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        canvas {
            background: #020408;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin: 10px auto;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 15px var(--accent-cyan);
            transform: scale(1.05);
        }

        .back-link {
            margin-top: 15px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>SPACE SHOOTER <span style="font-size: 1rem; color: #fff;">(Shield & Power-Up Edition)</span></h1>
        
        <div class="ui-panel">
            <div>Score: <span id="scoreVal" style="color: var(--accent-cyan);">0</span></div>
            <div>Shield: <span id="shieldVal" style="color: #00ff80;">OFF</span></div>
            <div>Lives: <span id="livesVal" style="color: #ff4d4d;">3</span></div>
        </div>

        <canvas id="gameCanvas" width="480" height="600"></canvas>
        
        <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>
        <br>
        <a href="games.html" class="back-link">← Back to AI Games</a>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let hasShield = false;
        let powerLevel = 1; // 1: Normal, 2: Double Shot, 3: Triple Shot

        let ship = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 6,
            dx: 0
        };

        let bullets = [];
        let enemies = [];
        let powerUps = [];
        let particles = [];
        let keys = {};

        // Keyboard Event Listeners
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code === "Space" && isPlaying) {
                shootBullet();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function shootBullet() {
            if (powerLevel === 1) {
                bullets.push({ x: ship.x + ship.width / 2 - 3, y: ship.y, width: 6, height: 12, speed: 8 });
            } else if (powerLevel === 2) {
                bullets.push({ x: ship.x + 5, y: ship.y, width: 5, height: 12, speed: 8 });
                bullets.push({ x: ship.x + ship.width - 10, y: ship.y, width: 5, height: 12, speed: 8 });
            } else {
                bullets.push({ x: ship.x + ship.width / 2 - 3, y: ship.y, width: 6, height: 12, speed: 8 });
                bullets.push({ x: ship.x, y: ship.y + 5, width: 5, height: 10, speed: 8, dx: -1 });
                bullets.push({ x: ship.x + ship.width - 5, y: ship.y + 5, width: 5, height: 10, speed: 8, dx: 1 });
            }
        }

        function startGame() {
            score = 0;
            lives = 3;
            hasShield = false;
            powerLevel = 1;
            bullets = [];
            enemies = [];
            powerUps = [];
            particles = [];
            isPlaying = true;
            document.getElementById("startBtn").style.display = "none";
            loop();
        }

        function spawnEnemy() {
            // බාධක (Enemies) එන ප්‍රමාණය තරමක් පාලනය කර ඇත
            if (Math.random() < 0.022) { 
                let size = Math.random() * 20 + 25;
                enemies.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: Math.random() * 1.5 + 1.2 // වේගය තරමක් අඩු කර ඇත
                });
            }
            // Shield හෝ Power-up එකක් අතරින් පතර පැමිණීම
            if (Math.random() < 0.003) {
                powerUps.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 2,
                    type: Math.random() > 0.5 ? 'shield' : 'powerup'
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            // Ship movement
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                ship.x -= ship.speed;
            }
            if (keys["ArrowRight"] || keys["KeyD"]) {
                ship.x += ship.speed;
            }

            // Boundaries
            if (ship.x < 0) ship.x = 0;
            if (ship.x + ship.width > canvas.width) ship.x = canvas.width - ship.width;

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].dx) bullets[i].x += bullets[i].dx;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Update Enemies
            spawnEnemy();
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // Collision with Ship
                if (
                    ship.x < enemies[i].x + enemies[i].width &&
                    ship.x + ship.width > enemies[i].x &&
                    ship.y < enemies[i].y + enemies[i].height &&
                    ship.y + ship.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    if (hasShield) {
                        hasShield = false; // Shield එක මඟින් පහරින් බේරේ
                    } else {
                        lives--;
                        powerLevel = 1; // පහරක් වැදුනහොත් Power level එක අඩුවේ
                        if (lives <= 0) {
                            isPlaying = false;
                            document.getElementById("startBtn").style.display = "inline-block";
                            document.getElementById("startBtn").innerText = "Play Again";
                        }
                    }
                    continue;
                }

                // Remove out of bounds
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                }
            }

            // Update Power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].y += powerUps[i].speed;

                // Collision with Ship
                if (
                    ship.x < powerUps[i].x + powerUps[i].width &&
                    ship.x + ship.width > powerUps[i].x &&
                    ship.y < powerUps[i].y + powerUps[i].height &&
                    ship.y + ship.height > powerUps[i].y
                ) {
                    if (powerUps[i].type === 'shield') {
                        hasShield = true;
                    } else {
                        if (powerLevel < 3) powerLevel++;
                    }
                    powerUps.splice(i, 1);
                    continue;
                }

                if (powerUps[i].y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // Bullet & Enemy Collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (
                        bullets[i] &&
                        bullets[i].x < enemies[j].x + enemies[j].width &&
                        bullets[i].x + bullets[i].width > enemies[j].x &&
                        bullets[i].y < enemies[j].y + enemies[j].height &&
                        bullets[i].y + bullets[i].height > enemies[j].y
                    ) {
                        score += 10;
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Update UI
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("shieldVal").innerText = hasShield ? "ACTIVE" : "OFF";
            document.getElementById("livesVal").innerText = lives;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ship
            ctx.fillStyle = "#00f0ff";
            ctx.beginPath();
            ctx.moveTo(ship.x + ship.width / 2, ship.y);
            ctx.lineTo(ship.x, ship.y + ship.height);
            ctx.lineTo(ship.x + ship.width, ship.y + ship.height);
            ctx.closePath();
            ctx.fill();

            // Draw Shield Aura if active
            if (hasShield) {
                ctx.strokeStyle = "#00ff80";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ship.x + ship.width / 2, ship.y + ship.height / 2, 30, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Bullets
            ctx.fillStyle = "#ffcc00";
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Draw Enemies (Asteroids)
            ctx.fillStyle = "#ff4d4d";
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x + e.width / 2, e.y + e.height / 2, e.width / 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Power-ups (Green/Blue glowing items)
            powerUps.forEach(p => {
                ctx.fillStyle = p.type === 'shield' ? '#00ff80' : '#00f0ff';
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });
        }

        function loop() {
            update();
            draw();
            if (isPlaying) {
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
